apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "persona-ai-creator.fullname" . }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "persona-ai-creator.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "persona-ai-creator.fullname" . }}
    spec:
      containers:
        - name: app
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "persona-ai-creator.fullname" . }}-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "persona-ai-creator.fullname" . }}-secret
                  key: JWT_SECRET
            - name: SHARED_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "persona-ai-creator.fullname" . }}-secret
                  key: SHARED_POSTGRES_PASSWORD
            - name: KUBECONFIG
              value: "/app/secrets/team-g-kubeconfig.yaml"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "persona-ai-creator.fullname" . }}-secret
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "persona-ai-creator.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}

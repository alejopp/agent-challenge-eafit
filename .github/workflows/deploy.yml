name: Deploy Persona AI Creator

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - get-credentials
          - all
        default: all
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/deploy.yml"
      - "web-app/**"

jobs:
  deploy-persona-ai-creator:
    name: Build and Deploy Persona AI Creator
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RELEASE_NAME: persona-ai-creator
      CHART_PATH: ./web-app/helm/persona-ai-creator
      IMAGE_NAME: eafit-persona-agent-creator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" && "${GITHUB_REF_NAME}" != "develop" ]]; then
            echo "::error::This workflow can only run on main or develop branches (current: ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "NETWORK=testnet" >> "$GITHUB_ENV"

      - name: Load configuration
        run: |
          set -a
          source config.env
          set +a
          while IFS= read -r line; do
            key="${line%%=*}"
            echo "${key}=${!key}" >> "$GITHUB_ENV"
          done < <(grep -E '^[A-Z_]+=' config.env)

      - name: Prepare deployment variables
        run: |
          NAMESPACE="${{ secrets.K8S_NAMESPACE }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="team-g"
          fi

          IMAGE_REPOSITORY="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: inputs.step == 'deploy' || inputs.step == 'all' || github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.step == 'deploy' || inputs.step == 'all' || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: inputs.step == 'deploy' || inputs.step == 'all' || github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./web-app
          file: ./web-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest

      - name: Set up kubeconfig
        env:
          OVH_KUBECONFIG: ${{ secrets.OVH_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$OVH_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Save kubeconfig for Helm secret
        env:
          OVH_KUBECONFIG: ${{ secrets.OVH_KUBECONFIG }}
        run: |
          mkdir -p /tmp/persona-ai
          echo "$OVH_KUBECONFIG" > /tmp/persona-ai/team-g-kubeconfig.yaml

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.9"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Validate Helm chart
        if: inputs.step == 'deploy' || inputs.step == 'all' || github.event_name == 'push'
        run: |
          helm template "$RELEASE_NAME" "$CHART_PATH" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set appSecrets.jwtSecret="${{ secrets.APP_JWT_SECRET }}" \
            --set appSecrets.sharedPostgresPassword="${{ secrets.SHARED_POSTGRES_PASSWORD }}" \
            --set appSecrets.openaiApiKey="${{ secrets.EXAMPLE_AGENT_OPENAI_API_KEY }}" \
            --set-file appSecrets.kubeconfig=/tmp/persona-ai/team-g-kubeconfig.yaml > /tmp/persona-ai/rendered.yaml

      - name: Deploy Persona AI Creator
        if: inputs.step == 'deploy' || inputs.step == 'all' || github.event_name == 'push'
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --set appSecrets.jwtSecret="${{ secrets.APP_JWT_SECRET }}" \
            --set appSecrets.sharedPostgresPassword="${{ secrets.SHARED_POSTGRES_PASSWORD }}" \
            --set appSecrets.openaiApiKey="${{ secrets.EXAMPLE_AGENT_OPENAI_API_KEY }}" \
            --set-file appSecrets.kubeconfig=/tmp/persona-ai/team-g-kubeconfig.yaml \
            --set vs-agent-chart.extraEnv[0].name=AGENT_WALLET_ID \
            --set vs-agent-chart.extraEnv[0].value="Persona AI Creator" \
            --set vs-agent-chart.extraEnv[1].name=AGENT_WALLET_KEY \
            --set vs-agent-chart.extraEnv[1].value="${{ secrets.EXAMPLE_AGENT_WALLET_KEY }}" \
            --burst-limit 100 \
            --wait --timeout 10m

      - name: Show deployed resources
        if: always()
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide || true
          kubectl get svc -n "$NAMESPACE" || true
          kubectl get deploy,statefulset,pvc -n "$NAMESPACE" || true

      # -----------------------------------------------------------------------
      # GET-CREDENTIALS: Issue Service credential for all deployed agents
      # Uses the org public admin API — no port-forward needed.
      # Skips agents that already have a linked Service credential.
      # -----------------------------------------------------------------------
      - name: Get Service credentials for all agents
        if: inputs.step == 'get-credentials' || inputs.step == 'all'
        run: |
          source common/common.sh
          set_network_vars "$NETWORK"

          ORG_ADMIN_API="${ORG_VS_ADMIN_URL}"
          BASE_DOMAIN="agents.team-g.teams.eafit.testnet.verana.network"

          # Discover the Service JSC URL once (shared for all agents)
          SERVICE_VTJSC_OUTPUT=$(discover_ecs_vtjsc "$ECS_TR_PUBLIC_URL" "service")
          SERVICE_JSC_URL=$(echo "$SERVICE_VTJSC_OUTPUT" | sed -n '1p')

          # List all persona-* Helm releases (each is a deployed agent), excluding the creator app itself
          AGENTS=$(helm list -n "$NAMESPACE" --short | grep '^persona-' | grep -v '^persona-ai-creator$' | sed 's/^persona-//')

          if [ -z "$AGENTS" ]; then
            warn "No persona-* agents found in namespace $NAMESPACE"
            exit 0
          fi

          for AGENT_NAME in $AGENTS; do
            AGENT_PUBLIC_URL="https://${AGENT_NAME}.${BASE_DOMAIN}"
            
            echo ""
            log "Processing agent: $AGENT_NAME ($AGENT_PUBLIC_URL)"

            # Create a secure tunnel to the agent's private Admin API (port 3000)
            kubectl port-forward "pod/persona-${AGENT_NAME}-0" 3000:3000 -n "$NAMESPACE" &
            PF_PID=$!
            
            # Wait for the tunnel and agent to be ready
            AGENT_ADMIN_API="http://localhost:3000"
            max_retries=15
            count=0
            while ! curl -sf "${AGENT_ADMIN_API}/v1/agent" >/dev/null 2>&1; do
              sleep 2
              count=$((count + 1))
              if [ $count -ge $max_retries ]; then
                err "Timed out waiting for agent $AGENT_NAME tunnel"
                kill $PF_PID || true
                continue 2
              fi
            done

            # Get agent DID from the tunnel
            CHILD_DID=$(curl -sf "${AGENT_ADMIN_API}/v1/agent" | jq -r '.publicDid // empty')
            if [ -z "$CHILD_DID" ]; then
              err "$AGENT_NAME — Could not get DID from local API, skipping"
              kill $PF_PID || true
              continue
            fi
            echo "  DID: $CHILD_DID"

            # Extract agent-specific metadata
            AGENT_DISPLAY_NAME=$(kubectl get configmap "persona-${AGENT_NAME}-agent-pack" -n "$NAMESPACE" \
              -o jsonpath='{.data.agent-pack\.yaml}' 2>/dev/null \
              | grep -E '^  displayName:' | sed 's/.*displayName: *//' | tr -d '"' | head -1)
            AGENT_DESCRIPTION=$(kubectl get configmap "persona-${AGENT_NAME}-agent-pack" -n "$NAMESPACE" \
              -o jsonpath='{.data.agent-pack\.yaml}' 2>/dev/null \
              | grep -E '^  description:' | sed 's/.*description: *//' | tr -d '"' | head -1)

            # Fallback to config.env values if not found in ConfigMap
            AGENT_DISPLAY_NAME="${AGENT_DISPLAY_NAME:-$SERVICE_NAME}"
            AGENT_DESCRIPTION="${AGENT_DESCRIPTION:-$SERVICE_DESCRIPTION}"
            echo "  Name: $AGENT_DISPLAY_NAME"
            echo "  Description: $AGENT_DESCRIPTION"

            # Try to get agent-specific logo from vs-agent StatefulSet env
            AGENT_LOGO_URL=$(kubectl get statefulset "persona-${AGENT_NAME}" -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SERVICE_LOGO_URL")].value}' 2>/dev/null || true)
            AGENT_LOGO_URL="${AGENT_LOGO_URL:-$SERVICE_LOGO_URL}"
            echo "  Logo: $AGENT_LOGO_URL"

            # Download logo (skip if empty)
            if [ -n "$AGENT_LOGO_URL" ]; then
              download_logo_data_uri "$AGENT_LOGO_URL" > /tmp/service_logo_data_uri 2>/dev/null || echo -n "" > /tmp/service_logo_data_uri
            else
              echo -n "" > /tmp/service_logo_data_uri
            fi

            SERVICE_CLAIMS=$(jq -n \
              --rawfile logo /tmp/service_logo_data_uri \
              --arg id "$CHILD_DID" \
              --arg name "$AGENT_DISPLAY_NAME" \
              --arg type "${SERVICE_TYPE:-AIAgent}" \
              --arg desc "$AGENT_DESCRIPTION" \
              --argjson age "${SERVICE_MIN_AGE:-0}" \
              --arg terms "${SERVICE_TERMS:-}" \
              --arg privacy "${SERVICE_PRIVACY:-}" \
              '{id: $id, name: $name, type: $type, description: $desc, logo: ($logo | rtrimstr("\n")), minimumAgeRequired: $age, termsAndConditions: $terms, privacyPolicy: $privacy}')

            # Issue and link via the secure tunnel
            issue_remote_and_link "$ORG_ADMIN_API" "$AGENT_ADMIN_API" "service" "$SERVICE_JSC_URL" "$CHILD_DID" "$SERVICE_CLAIMS"
            
            # Close the tunnel
            kill $PF_PID || true
          done

      # -----------------------------------------------------------------------
      # CLEANUP
      # -----------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "## Persona AI Creator Deployment"
            echo ""
            echo "- Namespace: \`$NAMESPACE\`"
            echo "- Release: \`$RELEASE_NAME\`"
            echo "- Image: \`$IMAGE_REPOSITORY:$IMAGE_TAG\`"
            echo "- Chart: \`$CHART_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"
